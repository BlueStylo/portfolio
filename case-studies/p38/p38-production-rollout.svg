<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bambu Lab production rollout diagram</title>
  <desc id="desc">A public-safe diagram showing how equipment selection becomes operating standards, documentation, training, and production review.</desc>
  <style>
    text {
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #1f2429;
    }
    .bg {
      fill: #f4f8f8;
    }
    .panel {
      fill: #ffffff;
      stroke: #d4dfe0;
      stroke-width: 2;
    }
    .band {
      fill: #dcecec;
    }
    .accent {
      fill: #287d83;
    }
    .accent2 {
      fill: #d9913f;
    }
    .line {
      fill: none;
      stroke: #1f2429;
      stroke-linecap: round;
      stroke-width: 3;
    }
    .kicker {
      fill: #287d83;
      font-size: 20px;
      font-weight: 900;
    }
    .title {
      font-size: 39px;
      font-weight: 900;
    }
    .muted {
      fill: #657078;
      font-size: 23px;
      font-weight: 720;
    }
    .body {
      fill: #46505a;
      font-size: 22px;
      font-weight: 680;
    }
    .number {
      fill: #ffffff;
      font-size: 18px;
      font-weight: 900;
    }
  </style>
  <rect class="bg" width="1200" height="760"/>
  <rect class="band" x="0" y="0" width="1200" height="204"/>
  <text class="kicker" x="64" y="76">P38 / Manufacturing ops</text>
  <text class="title" x="64" y="126">장비 도입을 생산 운영 체계로 바꾸는 흐름</text>
  <text class="muted" x="64" y="168">A1 mini, AMS, H2D 같은 장비 선택을 문서화, 교육, 후처리 기준으로 연결합니다.</text>

  <g transform="translate(70 278)">
    <rect class="panel" width="190" height="152" rx="14"/>
    <circle class="accent" cx="36" cy="36" r="18"/>
    <text class="number" x="28" y="43">01</text>
    <text class="kicker" x="24" y="82">Decision</text>
    <text class="body" x="24" y="120">장비 비교</text>
  </g>
  <path class="line" d="M270 354 H346"/>
  <polygon points="346,354 328,344 328,364" fill="#1f2429"/>

  <g transform="translate(356 278)">
    <rect class="panel" width="190" height="152" rx="14"/>
    <circle class="accent2" cx="36" cy="36" r="18"/>
    <text class="number" x="28" y="43">02</text>
    <text class="kicker" x="24" y="82">Rollout</text>
    <text class="body" x="24" y="120">프린터 배치</text>
  </g>
  <path class="line" d="M556 354 H632"/>
  <polygon points="632,354 614,344 614,364" fill="#1f2429"/>

  <g transform="translate(642 278)">
    <rect class="panel" width="190" height="152" rx="14"/>
    <circle class="accent" cx="36" cy="36" r="18"/>
    <text class="number" x="28" y="43">03</text>
    <text class="kicker" x="24" y="82">Standard</text>
    <text class="body" x="24" y="120">사용법 문서화</text>
  </g>
  <path class="line" d="M842 354 H918"/>
  <polygon points="918,354 900,344 900,364" fill="#1f2429"/>

  <g transform="translate(928 278)">
    <rect class="panel" width="190" height="152" rx="14"/>
    <circle class="accent2" cx="36" cy="36" r="18"/>
    <text class="number" x="28" y="43">04</text>
    <text class="kicker" x="24" y="82">Review</text>
    <text class="body" x="24" y="120">품질·안전 점검</text>
  </g>

  <g transform="translate(92 526)">
    <rect class="panel" width="304" height="108" rx="14"/>
    <text class="kicker" x="24" y="42">Equipment evidence</text>
    <text class="body" x="24" y="78">A1 mini / H2D / AMS</text>
  </g>
  <g transform="translate(448 526)">
    <rect class="panel" width="304" height="108" rx="14"/>
    <text class="kicker" x="24" y="42">Operational docs</text>
    <text class="body" x="24" y="78">slicer, filament, plate policy</text>
  </g>
  <g transform="translate(804 526)">
    <rect class="panel" width="304" height="108" rx="14"/>
    <text class="kicker" x="24" y="42">Public-safe rule</text>
    <text class="body" x="24" y="78">제품·주문 단서는 제거</text>
  </g>
</svg>
